
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Health Insurance Predictor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container py-5">
    <div class="card shadow-lg mx-auto p-4" style="max-width: 650px;">

        <h2 class="text-center mb-2">Health Insurance Predictor</h2>
        <p class="text-center text-muted mb-4">
            Enter your details to estimate insurance charges.
        </p>

        <form id="insuranceForm">

            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control"
                       maxlength="100" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="age" class="form-label">Age</label>
                    <input type="number" id="age" class="form-control"
                           min="18" max="120" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="gender" class="form-label">Gender</label>
                    <select id="gender" class="form-select" required>
                        <option value="">Select gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="bmi" class="form-label">BMI</label>
                <input type="number" id="bmi" class="form-control"
                       min="10" max="100" step="0.01" required>
            </div>

            <div class="mb-3">
                <label for="children" class="form-label">
                    Number of Children
                </label>
                <input type="number" id="children" class="form-control"
                       min="0" max="20" required>
            </div>

            <div class="mb-4">
                <label for="smoker" class="form-label">
                    Do you smoke?
                </label>
                <select id="smoker" class="form-select" required>
                    <option value="">Select an option</option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
            </div>

            <button type="submit" id="submitBtn"
                    class="btn btn-primary w-100">
                Predict Insurance Charges
            </button>
        </form>

        <div id="message" class="mt-3" role="status"
             aria-live="polite"></div>

        <div id="result" class="result-box mt-4 d-none">
            <p class="mb-1">Estimated Insurance Charges</p>
            <h3 id="prediction"></h3>
            <small class="text-muted">
                This is a model estimate, not an actual insurance quote.
            </small>
        </div>

    </div>
</div>

<script>
const form = document.getElementById("insuranceForm");
const message = document.getElementById("message");
const result = document.getElementById("result");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    message.textContent = "";
    result.classList.add("d-none");
    submitBtn.disabled = true;
    submitBtn.textContent = "Predicting...";

    const payload = {
        name: document.getElementById("name").value.trim(),
        age: Number(document.getElementById("age").value),
        gender: document.getElementById("gender").value,
        bmi: Number(document.getElementById("bmi").value),
        no_of_children: Number(
            document.getElementById("children").value
        ),
        isSmoker: document.getElementById("smoker").value === "true"
    };

    try {
        const response = await fetch(
            "http://127.0.0.1:8000/predict",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                typeof data.detail === "string"
                    ? data.detail
                    : "Please check your inputs and try again."
            );
        }

        document.getElementById("prediction").textContent =
            Number(data.predicted_charges).toLocaleString(
                "en-IN",
                { maximumFractionDigits: 2 }
            );

        result.classList.remove("d-none");

    } catch (error) {
        message.textContent =
            "Error: " + error.message +
            ". Check that the FastAPI server is running.";
        message.className = "alert alert-danger mt-3";
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Predict Insurance Charges";
    }
});
</script>
</body>
</html>
